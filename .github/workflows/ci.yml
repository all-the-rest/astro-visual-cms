name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  astro-compat:
    name: Astro compatibility (${{ matrix.astro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        astro: ['7.2.4', '7.2.10', '7.3.8', '7.4.7']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24 and pnpm 11.23.0
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          version: 11.23.0
          install: false
      - name: Verify packed package compatibility
        run: npm run verify:astro-compat -- ${{ matrix.astro }}

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24 and pnpm 11.23.0
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          version: 11.23.0
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify distributable editor tarball
        run: npm run pack:smoke

      - name: Run browser tests
        run: pnpm run browser-tests

      - name: Run isolated-copy read-only browser test
        run: pnpm run browser-tests:readonly

      - name: Run isolated-copy unmapped-output browser test
        run: pnpm run browser-tests:unmapped

      - name: Run isolated-copy gallery browser test
        run: pnpm run browser-tests:gallery-copy

      - name: Run isolated-copy MDX collection browser test
        run: pnpm run browser-tests:collection-copy

      - name: Run isolated-copy Markdown selection browser test
        run: pnpm run browser-tests:markdown-copy

      - name: Run isolated-copy Content Layer visual Markdown draft test
        run: pnpm run browser-tests:markdown-draft-copy

      # Diagnostic for issue #25: the collection-copy run stalled for the full 120s
      # test budget without leaving any evidence. This step uploads Playwright's
      # output directory only when an earlier step failed, so a failing run keeps its
      # trace. The upload stays read-only in scope (the job keeps `contents: read`
      # and the action is pinned to a full commit SHA). Traces include synthetic
      # data, test sources and ephemeral session headers. The harness writes absolute
      # temporary-file receipts into test-results/, which are excluded here, the
      # artifact name is per attempt so a retry cannot overwrite the failed attempt's
      # trace, and the artifact is retained briefly.
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ github.run_attempt }}
          path: |
            test-results/
            !test-results/readonly-*-path
          if-no-files-found: ignore
          retention-days: 7
